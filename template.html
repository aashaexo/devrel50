<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 50 DevRels on X by aasha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#16181c;--card:#1d2025;--card-h:#24272d;--text:#f2f2f3;--muted:#a3a6ad;--line:#2c3036;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding:56px 24px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:28px;font-weight:500;letter-spacing:-.02em}
h1 span{color:var(--muted);font-weight:400}
.search{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.search input{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;width:260px;outline:none;transition:border-color .15s ease}
.search input:focus{border-color:#4a4f57}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:block;background:var(--card);border-radius:10px;padding:12px;color:inherit;text-decoration:none;
 opacity:0;transform:translateY(8px);animation:in .5s var(--ease) forwards;animation-delay:calc(var(--i)*25ms);transition:background-color .2s ease,transform .2s var(--ease)}
.card.hide{display:none}
@keyframes in{to{opacity:1;transform:none}}
.media{aspect-ratio:1;border-radius:6px;overflow:hidden;background:#fff}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:#2a2e35;color:var(--muted);font-size:64px}
.meta{padding:14px 2px 4px}
.label{font-size:13px;color:var(--muted)}
h2{font-size:18px;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:4px 0 8px}
p{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.card:hover{background:var(--card-h)}.card:hover .media img{transform:scale(1.04)}}
.card:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}.media img{transition:none}}
</style></head><body><div class="wrap">
<header><h1>Top 50 DevRels on X <span>by aasha</span></h1></header>
<div class="search"><input id="q" placeholder="Search" autocomplete="off"></div>
<main class="grid" id="grid">{{CARDS}}</main></div>
<script>
const q=document.getElementById('q'),cs=[...document.querySelectorAll('.card')];
q.addEventListener('input',()=>{const v=q.value.toLowerCase();cs.forEach(c=>c.classList.toggle('hide',!c.textContent.toLowerCase().includes(v)))});
</script></body></html>
